# deslop 配置（AI-slop 启发式扫描器，v0.2.0）
# 基线（2026-11-27，deslop 0.2.0）：默认档 1114 条 → 本配置后 21 条（主仓 6、umaai_next 15）
# 官方文档（仓库默认分支 master）：
#   仓库：         https://github.com/chinmay-sawant/deslop
#   Rust 规则清单： https://github.com/chinmay-sawant/deslop/blob/master/guides/v0.2.0/rust/heuristics-and-findings.md
#   误报判定：     https://github.com/chinmay-sawant/deslop/blob/master/guides/v0.2.0/false-positive.md
#   规则注册表：   https://github.com/chinmay-sawant/deslop/blob/master/rules/registry.json
#   在线站点：     https://chinmay-sawant.github.io/deslop/
# 范围：只检查 Rust 代码区域（主仓 crates + 引擎子模块 umaai_next）。
# 仓内 .py 只存在于 scripts/ 与 benchmark/_local/，两处整体抑制，等效于只扫 Rust。

suppressed_paths = ["scripts", "benchmark"]

# 临时启用（2026-11-27 用户要求，性能观察）：rust_clone_heavy_state_in_loop、rust_hashmap_default_hasher。
# 关闭高误报 / 与项目约定冲突 / 纯 info 的规则；保留架构规模提示 + 3 条子模块信号。
