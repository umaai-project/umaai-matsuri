# 骏大祭剧本配置（`matsuri_config.toml`）
#
# 两层：
#   1. 全局运行设置：[pre]（局外切 / 心情盾）、[search]（搜索预算与作用面）
#   2. 卡组参数：[decks.<name>]；[decks.default] 是完整默认档（原 speed_build / 21101），
#   3. 搜索蒸馏权重：同目录 distilled.toml（存在才加载，不写进本文件）。
#      其他档只写差异，深合并到 default；variant = true 只用于扫参，必须按名字显式选。
# 未匹配任何非 variant 档的 comp 自动走 default。
#
# 默认档 = GA run2 冠军 g0269（2026-11-09 定档；起点 = lab 冠军 `ga-r2`）：
#   手写档对 ga-r2 +3758；搜索档 N=8192 配对 39 局 +898 ±259（t 3.47）。
#   耐 / 智两档同法独立调参，见文件末尾；口径与过程见 benchmark/README.md 与 docs/changelog.md。
# 改这里必须同步 `deck_config.rs` 的 `DeckParams::default()`（`tests/data.rs` 断言两者相等）。
#
# 融合校验：第 2 年（turn 23 结束）恰 2 组、第 3 年（turn 47 结束）恰 3 组；
# base 只能用 101–501 且不重复（两年合计覆盖全部 5 个）；
# year2 target 各用一次 601 / 701，year3 target 各用一次 801 / 901 / 1001。
# 教诲落位写基础 id（101–501）：101 絆 / 201 得意率 / 301 ヒント / 401 助力 / 501 体力；
# 転成后仍是同一槽，换融合方案不会让预设失效。

# ---------- 全局运行设置 ----------

[pre]
# 局外「切」状态：none / xiaoqie / qiezhe（默认不注入）
#   xiaoqie（小切 / 勉強家）：评分 PT 项 ×1.04；局内获得切者后失效
#   qiezhe（切者）：评分 PT 项 ×1.1；与小切互斥
# 与引擎 `[sim]` 的种马因子同属建局前输入，剧本自持。按自己的种马 / 局外状态开关；
# 理想测试档用 `bench --qie xiaoqie --shield 2` 或工作目录覆盖层开启。
qie = "none"
# 心情盾（ポジティブ思考）次数：抵消 N 次干劲下降（一次扣减只消耗 1 层）
positive_thinking = 0
# 灵感效率：把「单技能封顶」的期望损耗折成确定性折扣（0–1；1.0 = 不折算）
hint_efficiency = 0.92

# 继承扩展（本仓自持，暂不改引擎）：前 6 项覆盖引擎 `[sim].extra_count`，第 7 项 = 折扣等级
[pre.inherit]
# 速 / 耐 / 力 / 根 / 智 / PT / 折扣等级
# 每次继承名义 70 级（缩放固定 1.0）；覆盖系数决定其中多少分进已有技能桶（按每卡 5×技能数容量吸收），
# 其余视作新技能直接进总等级。
extra_count = [0, 0, 90, 90, 0, 10, 70]
cover = 0.5
# bucket = 覆盖 + 新技能；flat = 全部直接进总等级
mode = "bucket"

# 搜索档作用面（FlatSearch；search_n = 0 时全部退化回手写档）
[search]
# 每个候选的 rollout 次数：0 = 手写档
search_n = 8192
# 搜索 rayon 全局池线程数：0 = 自动（逻辑核数）；显式设了 RAYON_NUM_THREADS 时以环境变量为准
# 只对在线 / 离线主入口生效；bench / cardtest / sweep 仍用各自的 --threads
# 注意：覆盖层若写了 [search] 段就整段替换，未写 threads 会回落为 0（自动）
threads = 0
# 三类决策是否走 FlatSearch
train = true
advice = true
event = true
# 搜索内核的 PT 偏好覆盖（省略 = 与手写档同口径，即取当前档的 [trainer].pt_favor_rate）
# 只改搜索排序与搜索侧期望分换算；手写训练员（剪枝 / fallback / rollout 教师）不受影响。
# 刷 PT 档示例：pt_favor_rate = 5.0（配合 --search-n 才有意义）
# pt_favor_rate = 5.0

# ---------- 卡组参数 ----------

[decks.default]
comp = [2, 1, 1, 0, 1]
note = "速主默认档（原 speed_build / 21101）；未匹配卡组走这里"

[decks.default.fusion]
year2 = [
    { base = 101, target = 601 },
    { base = 201, target = 701 },
]
# 第 3 年顺序 = 冠军档（「融合 #2」）：501→801 / 301→901 / 401→1001
year3 = [
    { base = 501, target = 801 },
    { base = 301, target = 901 },
    { base = 401, target = 1001 },
]

# 教诲落位预设：每行顺序 = 速 / 耐 / 力 / 根 / 智；值 = 基础教诲 id。
# t47 / t59 受 401+801 硬约束：协助（501 → 801）实际必须落在**担当数最多的演目**（默认卡组 = 速位），
# 预设若把它写在别的位，该窗口 120 个候选里就没有等于预设的方案（route 先验命中 0 格，白写）。
# 2026-11-13 修正 t47：原 [101, 501, 401, 301, 201]（协助在耐）不可行（可行 0/10），
# 改为 [501, 101, 401, 301, 201]（协助在速）；实测手写 3000 局 / 搜索 10 局逐位不变，纯口径修正。
[decks.default.advice]
t2 = [101, 201, 501, 301, 401]
t11 = [101, 501, 201, 301, 401]
t23 = [101, 401, 501, 301, 201]
t35 = [101, 501, 301, 401, 201]
t47 = [501, 101, 401, 301, 201]
t59 = [501, 401, 101, 301, 201]

# 手写训练员策略旋钮
[decks.default.trainer]
# 目标函数的 PT 偏好：1.0 = 官方评分；官方计分固定 ×2.0，此处只影响决策优先级。
# 2026-11-08 扫测（N=2048 × 10 局）：1.0→3.0 总分持平、PT 单调升、技能+五维等量降——
# 它是「构成偏好」而非「分数旋钮」。
pt_favor_rate = 1.931954
# 体力低于此值进入「该休息了」区间（仍由打分表对比收益）
rest_vital = 66
# 発表会 / 本番达标保护的提前回合（0 = 关闭）
checkpoint_margin = 4
# Senior 合宿前把「有编成卡的演目」推到的最小 Lv（0 = 关闭）
act_level_target = 2
# 是否打自选比赛（false = 只在目标赛出手）
self_race = false
# 友人外出是否尽早用完（攻略策略；false = 按收益打分）
friend_outing_early = true
# 自选比赛（freeRaces 义务区间）补足紧迫度软加分（0 = 关；硬保底不受此开关影响）
free_race_urgency = 1.764718
# 五维策略权重（速 / 耐 / 力 / 根 / 智；官方评分边际之外的偏好）
status_weights = [0.994888, 0.542242, 0.407084, 0.156003, 0.860951]

# 属性 / 资源 / 事件折算权重（单位 = 评分点）
[decks.default.trainer.weights]
vital = 5.730157
motivation = 10.93116
friendship = 3.339714
hint = 4.313881
gauge = 53.094769
act_level = 58.536224
checkpoint = 2223.151961
fat = 193.041812

# 教诲分配价值权重（特征系数；注意与 [decks.default.advice] 的落位预设区分）
[decks.default.trainer.advice]
card = 1.684001
npc = 0.3559
train = 0.153215
keiko = 1.158553
level = 0.772682
milestone = 0.028781
# 特化上限（601）/ 助力の支え（401）：实测噪声或有害，锁 0（GA 不搜）
status_limit = 0.0
assist = 0.0
# 落位先验强度（0 = 关；500 = 命中一格 +500，等价于外部钉位）
route = 392.251041

# 动态权重层（相对剩余空间 / 时间价值 / 稽古节奏；全 0 = 关闭）
[decks.default.trainer.dynamic]
status_catchup = 3.086141
act_catchup = 0.012934
