# 只写与 default 的差异：教诲六窗口重排 + 五维系数；fusion 与其余训练员旋钮继承 default。
# 依据：20111 SSR 卡组、seed 40,000,900 / 40,001,200 配对实测——五维倾斜 +1,373、
# 教诲倾斜 +1,816，合计 75,797 → 79,116。未做：fusion 扫描、12 场景验收、搜索档验收。
