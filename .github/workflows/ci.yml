# 骏大祭剧本仓 CI：引擎仓作为 Git Submodule 挂载于 `umaai_next/`，checkout 时启用 submodules 即可。
# 数据自持：引擎静态数据已拷入统一数据目录 `data/`（含双配置默认层），测试零参数即跑。
name: CI

on:
  push:
    branches: [main]
    paths-ignore: '**.md'
  pull_request:
    branches: [main]
    paths-ignore: '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # 与本地基准一致：固定 1.99.0，避免 fmt/clippy 随 CI 时间漂移
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      # 只检查本仓六个 crate：`--all` 会连带 path 依赖 umaai_next（引擎仓自有 rustfmt 配置）
      - name: fmt
        run: |
          for p in matsuri-core matsuri-sim matsuri-ai matsuri-cli matsuri-tools matsuri-launcher; do
            cargo fmt -p "$p" -- --check
          done

      - name: check
        run: cargo check --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --release

  deslop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rust-analyzer, rust-src

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install deslop-please
        run: cargo binstall -y deslop-please

      # 存量债务走仓根 allow 清单（22 条）；剩 11 条架构债（ADR-0011 提议中）未收敛，
      # 暂设为仅告警（continue-on-error）：不阻塞合并，但仍输出错误明细供跟踪。
      # 收敛到 0 后删掉 continue-on-error，恢复为门禁。
      - name: deslop-please
        continue-on-error: true
        run: deslop-please --allow .deslop-please.allow
