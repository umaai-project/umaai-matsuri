# export_support_card 运行配置
#
# 本文件替代原先硬编码在 main.py 里的所有可调数据，改数据不需要动代码。
# 路径可写 %USERPROFILE% 之类的环境变量或 ~；相对路径基于本文件所在目录。

[paths]
# 游戏 master.mdb（可填文件，也可填所在目录）。留空 = 自动检测，顺序为：
#   1) 命令行 --mdb          2) 本项
#   3) 环境变量 UMAMUSUME_MASTER_MDB
#   4) %USERPROFILE%\AppData\LocalLow\Cygames\umamusume\master\master.mdb
#   5) 脚本目录下的 master.mdb（仅当 fallback_script_dir = true）
master_mdb = ""
fallback_script_dir = true

# 翻译数据 text_data_dict.json（hachimi 的 localized_data 产物）。
# 文件存在时直接读取，不走网络；不存在时回落到 GitHub 下载并缓存到 translate_cache。
translate_file = "D:/UMA/Umamusume/hachimi/localized_data/text_data_dict.json"
translate_cache = "text_data_dict.json"

[output]
# 产物目录（相对本文件所在目录）。默认写仓根 data/，即引擎消费的位置。
dir = "../../data"
# 是否把翻译数据一并复制到产物目录（引擎同样读 data/text_data_dict.json）
copy_translate = true

[support_card]
# 卡类型简称，下标 = SupportCardType（与 umamodels 一致，勿改顺序）
short_types = ["", "速", "耐", "力", "根", "智", "友", "团"]

# 直接取值的面板字段（key 与 UmaSim cardValue 一致）
direct_keys = [
    "deYiLv",
    "failRateDrop",
    "ganJing",
    "hintProbIncrease",
    "saiHou",
    "vitalCostDrop",
    "wizVitalBonus",
    "xunLian",
    "youQing",
    "initialJiBan",
    "eventRecoveryAmountUp",
    "eventEffectUp",
]

# 固有效果直接并入面板（不按固有类型参数化）的卡：智太阳神、活动力乌拉拉、东商
direct_merge_cards = [30155, 30171, 30128]

# 无技能卡把 hint 技能点折算为属性时的补偿值，行 = 卡类型（速/耐/力/根/智）
hint_values = [
    [6, 0, 2, 0, 0, 0],
    [0, 6, 0, 2, 0, 0],
    [0, 2, 6, 0, 0, 0],
    [1, 0, 1, 6, 0, 0],
    [2, 0, 0, 0, 6, 0],
]

# 日文词条 → 下标映射（与 mdb 的 text_data 词条名一一对应）
[support_card.initial_keys]
"初期速度アップ" = 0
"初期持久力アップ" = 1
"初期パワーアップ" = 2
"初期根性アップ" = 3
"初期賢さアップ" = 4
"初期PTアップ" = 5

[support_card.bonus_keys]
"速度ボーナス" = 0
"持久力ボーナス" = 1
"パワーボーナス" = 2
"根性ボーナス" = 3
"賢さボーナス" = 4
"スキルポイントボーナス" = 5

# 自选比赛条件：name = 日志里的等级名，grade = 写入 umaDB.freeRaces[].grade
[[race_condition]]
id = 700
name = "Pre-OP"
grade = 4

[[race_condition]]
id = 100
name = "G1"
grade = 1

[[race_condition]]
id = 300
name = "G3"
grade = 3

