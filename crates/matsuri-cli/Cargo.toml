# 骏大祭剧本终端前端：跑局 bin `matsuri`
#
# 复用 `umaai-cli` 的呈现件（样例面，pub 面不承诺稳定）；手动动作选择用 inquire
# （非 TTY 退回编号输入），仅终端交互用；诊断日志器消费 `[output] log_level`。
[package]
name = "matsuri-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "matsuri"
path = "src/main.rs"

[dependencies]
matsuri-core.workspace = true
matsuri-ai.workspace = true
umaai-core.workspace = true
umasim.workspace = true
umaai.workspace = true
umaai-cli.workspace = true
clap.workspace = true
anyhow.workspace = true
log.workspace = true
rand.workspace = true
inquire = "0.9.4"
rayon.workspace = true
serde_json.workspace = true
