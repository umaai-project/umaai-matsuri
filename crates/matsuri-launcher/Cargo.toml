# 发布启动器：菜单 / 子进程装配 / 小黑板启动与通道只读体检
#
# 交互选择用 inquire（非 TTY 调用有编号输入兜底）；不依赖本仓业务 crate，
# 决策逻辑全在核心 CLI。命名避开 `matsuri-ai` 库 crate（见 docs/plan/release_launcher.md）。
[package]
name = "matsuri-launcher"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "matsuri-ai"
path = "src/main.rs"

[dependencies]
inquire = "0.9.4"
# 数据更新：清单协议 / HTTP 传输 / 逐文件校验 / 原子替换与回滚
umaai-update.workspace = true
# 程序更新：清单解析与 zip 解压
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
